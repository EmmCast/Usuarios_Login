spring.application.name=System_userAndLogin

# Configuracin del puerto de la aplicacin
server.port=8081

# Configuracin de la conexin a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/PuntoDeVenta
spring.datasource.username=postgres
spring.datasource.password=1536
# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracin de Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never
server.error.include-path=never

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=USER